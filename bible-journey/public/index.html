<!doctype html>
<!-- The game opens in Hebrew; LocaleProvider updates lang/dir if the player switches to English. -->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>פרייזר</title>
    <meta name="description" content="פרייזר: מסע מאויר בתנ״ך. מביטים בתמונה, מנחשים איזה סיפור מסתתר בה ומגלים אוצרות בדרך." />
    <meta name="theme-color" content="#291912" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="פרייזר" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="פרייזר | מסע בתנ״ך" />
    <meta property="og:description" content="מביטים בתמונה, מנחשים איזה סיפור מסתתר בה ומגלים אוצרות בדרך." />
    <!-- Share previews need an absolute address; update this if the game moves to another domain. -->
    <meta property="og:image" content="https://bible-journey-noah.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="phraser-boot">
      /* Match the game's earth tone so there is no white flash before the script runs. */
      html,
      body {
        margin: 0;
        background-color: #291912;
      }
      body {
        /* No pull-to-refresh or double-tap zoom in the middle of a round. */
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      /* Shown only while #root is still empty, so it disappears by itself when the game mounts. */
      #root:empty {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      #root:empty::before {
        content: "פרייזר";
        color: #e8bc76;
        font: 600 44px/1.2 "Frank Ruhl Libre", "David Libre", David, "Times New Roman", serif;
      }
      #root:empty::after {
        content: "פותחים את הספר…";
        color: #fff1d5;
        font: 20px/1.5 "Frank Ruhl Libre", "David Libre", David, "Times New Roman", serif;
        animation: phraser-boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes phraser-boot-pulse {
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::after {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>כדי לשחק בפרייזר צריך להפעיל JavaScript בדפדפן.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
